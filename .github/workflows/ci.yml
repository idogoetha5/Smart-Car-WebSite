name: CI

# Runs the same gates that were previously only ever run by hand, so a
# regression fails here instead of reaching production. Vercel deploys are
# triggered separately (the project has no Git integration at present), so
# this workflow only reports — it does not deploy.
on:
  push:
    branches: [clean-main]
  pull_request:
    branches: [clean-main]

# A newer push supersedes an in-flight run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        # The 12 React Compiler errors this used to have to tolerate are
        # gone — the components that fetched data in an effect read through
        # SWR now — so plain ESLint is the gate again, at zero errors.
        run: npm run lint

      - name: Lint ratchet
        # Secondary only, and deliberately not a substitute for the step
        # above. ESLint exits 0 on warnings, so without this a slow drift
        # back would go unnoticed; this fails the moment either count rises.
        run: npm run lint:budget

      - name: Unit tests
        run: npm test

      - name: Build
        # Secrets are never needed to prove the app compiles, but the
        # Turnstile guard deliberately throws when TURNSTILE_SECRET_KEY is
        # missing in a production build (that guard is the fix for the
        # bypass finding). A throwaway value satisfies it without putting a
        # real secret in CI — nothing here reaches a deployed environment.
        env:
          TURNSTILE_SECRET_KEY: ci-build-placeholder
          ADMIN_COOKIE_SECRET: ci-build-placeholder
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-build-placeholder
          NEXT_PUBLIC_APP_URL: https://www.smartcar.co.il
        run: npm run build

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans a commit range, so it needs the parent of the
          # oldest pushed commit to exist locally. checkout's default
          # shallow clone does not have it, and gitleaks then fails on
          # "unknown revision" — a red audit that says nothing about
          # secrets. Full history is what the action documents as required.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Dependency audit (production deps)
        # Reports current advisories without failing the build: the
        # outstanding ones come from packages nested inside Next.js and
        # cannot be resolved from this repo, so a hard failure here would
        # block every unrelated change. Reviewed per release instead.
        run: npm audit --omit=dev || true

      - name: Fail on new critical advisories
        # Not `npm audit --audit-level=critical`: that exits non-zero both for
        # a real advisory and for npm's audit endpoint being down, and the
        # second one has already turned this gate red on a green commit.
        # The script tells the two apart.
        run: node scripts/audit-critical.mjs

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
