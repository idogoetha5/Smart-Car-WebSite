name: Scheduled backups

# Runs the DB + Storage backups (scripts/run-backups.sh) on GitHub's
# infrastructure instead of Ido's personal Mac. A laptop that gets closed
# at night is not a reliable place to run an unattended 03:00 job — cron
# there only fires if the machine happens to be awake. GitHub Actions runs
# regardless of anyone's laptop.
#
# Schedule times are UTC. Israel is UTC+2 (winter) / UTC+3 (summer/IDT), so
# these land at 03:00/04:00 Israel time in summer and 04:00/05:00 in winter
# — a one-hour drift twice a year that a nightly backup can tolerate.
on:
  schedule:
    - cron: '0 0 * * *'   # daily — DB backup
    - cron: '0 1 * * 0'   # Sunday only — Storage (vehicle images) backup
  workflow_dispatch:
    inputs:
      mode:
        description: 'db | storage | all'
        default: 'all'

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install pg_dump, gnupg, rclone
        # Ubuntu's default postgresql-client is v16; the Supabase project is
        # on Postgres 17, and pg_dump refuses to dump a newer server than
        # itself. The PGDG apt repo carries a matching v17 client.
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo $VERSION_CODENAME)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone (Google Drive remote)
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "${{ secrets.RCLONE_CONFIG }}" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Write local-cron-convention dotfiles
        # run-backups.sh hardcodes both of these paths itself (matching the
        # local-cron convention) and exports SUPABASE_DB_URL /
        # BACKUP_PASSPHRASE_FILE / BACKUP_DIR / SUPABASE_URL / RCLONE_REMOTE /
        # R2_BUCKET from them unconditionally — any of those set directly as
        # step env below is silently clobbered. Matching the two files it
        # actually reads is the only thing that works on a runner.
        run: |
          printf '%s' "${{ secrets.SUPABASE_DB_URL }}" > ~/.smartcar-db-url
          printf '%s' "${{ secrets.BACKUP_PASSPHRASE }}" > ~/.smartcar-backup-pass
          chmod 600 ~/.smartcar-db-url ~/.smartcar-backup-pass

      - name: Pick mode for this trigger
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 1 * * 0" ]; then
            echo "mode=storage" >> "$GITHUB_OUTPUT"
          else
            echo "mode=db" >> "$GITHUB_OUTPUT"
          fi

      - name: Run backup
        # Only SUPABASE_SERVICE_ROLE_KEY needs to be set here — everything
        # else, run-backups.sh exports itself once the two dotfiles above
        # exist (see the comment on that step).
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bash scripts/run-backups.sh ${{ steps.mode.outputs.mode }}
