# Every 10 minutes: tell WhatsApp customers whose conversation is about to
# close (12 hours after their last message) that it will close in half an hour.
# Vercel's Hobby plan runs crons only once a day, so GitHub schedules this one.
# Needs the repository secret CRON_SECRET (the same value as on Vercel); without
# it the job does nothing.
name: WhatsApp closing notices

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send closing notices
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET is not set; skipping."; exit 0; fi
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" https://www.smartcar.co.il/api/cron/whatsapp-closing
